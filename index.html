<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef7ff">
<title>Nadi Waing - Good morning</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap');
:root{--ink:#405872;--muted:#7d91a6;--blue:#719bc2}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;overflow-x:hidden;color:var(--ink);font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;background:linear-gradient(145deg,#fffaf1 0%,#edf7ff 50%,#e9eaff 100%)}
.sky-glow{position:fixed;width:70vmin;height:70vmin;top:-32vmin;left:-20vmin;border-radius:50%;background:#fff0bd;opacity:.65;filter:blur(5px);pointer-events:none}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;color:#fff;font-size:22px;text-shadow:0 0 14px #8fb5dc;animation:twinkle 3s ease-in-out infinite}
.star:nth-child(1){top:12%;left:14%}.star:nth-child(2){top:25%;right:13%;animation-delay:-1s}.star:nth-child(3){bottom:18%;left:11%;animation-delay:-2s}.star:nth-child(4){bottom:13%;right:16%;animation-delay:-.5s}
.cloud{position:absolute;width:105px;height:30px;border-radius:40px;background:#ffffffb8;filter:drop-shadow(0 8px 12px #9ab7d522);animation:cloud 12s ease-in-out infinite alternate}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:43px;height:43px;left:15px;bottom:6px}.cloud:after{width:54px;height:54px;right:14px;bottom:2px}
.cloud.a{top:18%;right:4%;transform:scale(.8)}.cloud.b{bottom:13%;left:2%;transform:scale(.65);animation-delay:-5s}
.card{position:relative;width:min(100%,430px);padding:29px 23px 25px;text-align:center;border:1px solid #ffffff;border-radius:32px;background:#ffffffd9;backdrop-filter:blur(18px);box-shadow:0 25px 80px #819dc72a,inset 0 1px 0 white;animation:enter .8s ease both}
.pill{display:inline-block;padding:7px 13px;border:1px solid #dce8f5;border-radius:99px;background:#ffffffa6;color:#8296ab;font-size:.72rem}
h1{margin:17px 0 8px;font-size:clamp(1.8rem,8vw,2.4rem);font-weight:600;letter-spacing:-.04em;color:#4f6d8c,}
h1 span{color: #E15AAC;}
.intro{margin:0;color:var(--muted);font-size:.9rem;line-height:2;font-weight: 600;}
.scene{height:142px;display:grid;place-items:center;position:relative}
.flower{font-size:5rem;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 9px 10px #dfa5ad3d)}
.mini{position:absolute;font-size:1.25rem;animation:heart 3s ease-in-out infinite}.mini.a{left:23%;top:26%}.mini.b{right:23%;top:20%;animation-delay:-1.7s}
.buttons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{font-family:inherit;font-size:.83rem;font-weight:600;border:0;border-radius:99px;padding:12px 16px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
button:hover{transform:translateY(-3px);box-shadow:0 10px 22px #789fc344}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid #527ca5;outline-offset:3px}
button:disabled{opacity:.65;cursor:wait;transform:none}
.button-hint {
  display: inline-block;
  font-size: 22px;
  animation: handHint 1.5s ease-in-out infinite;
  position: absolute;
  margin-left: 50px;
}

@keyframes handHint {
  0%, 100% {
    opacity: 0.15;
    transform: translateY(-2px);
  }
  50% {
    opacity: 1;
    transform: translateY(3px);
  }
}
.primary{background:#739cc3;color:white;box-shadow:0 7px 17px #739cc333;margin-top: 20px;}
.secondary{background:#fff;color:#6484a4;border:1px solid #dce8f5;margin-top: 10px;}
.panel{display:none;margin-top:20px;padding:17px 13px;border-radius:22px;background:#f5f9ff;border:2px solid #e5eef8;box-shadow:0 7px 17px #739cc333}
.panel.show{display:block;animation:panelIn .5s cubic-bezier(.2,.8,.2,1) both}
.panel h2{margin:0 0 9px;color:#58799b;font-size:1.1rem;font-weight:600}
.panel p{margin:0;color:#657c92;font-size:.9rem;line-height:2;font-weight: 600;}
.small-note{margin-top:10px!important;color:#91a1b2!important;font-size:.72rem!important;font-weight: 600;}
.moods{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.mood{background:white;border:1px solid #dce8f5;color:#58799b;padding:9px 12px}
.mood.selected{background:#dceeff;border-color:#9ec5e9;transform:scale(1.05)}
.reply{min-height:45px}
.footer{margin:18px 0 0;color:#9aa9b8;font-size:.68rem}
#petalLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.petal{position:absolute;top:65%;font-size:23px;animation:burst 1.4s ease-out forwards}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);padding:10px 15px;background:#526f8d;color:white;border-radius:99px;font-size:.76rem;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;box-shadow:0 8px 25px #526f8d33;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Loading overlay */
.loading-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:25px;background:linear-gradient(150deg,#fffaf1 0%,#edf7ff 48%,#e9eaff 100%);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease}
.loading-screen.active{opacity:1;visibility:visible}
.loading-card{width:min(100%,330px);padding:30px 22px;text-align:center;border:1px solid #fff;border-radius:30px;background:#ffffffd9;box-shadow:0 22px 65px #819dc72b;transform:translateY(12px) scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.loading-screen.active .loading-card{transform:translateY(0) scale(1)}
.loading-flower{font-size:3.8rem;display:inline-block;animation:loadingFloat 1.2s ease-in-out infinite}
.loading-title{margin:13px 0 7px;font-size:1.15rem;font-weight:600;color:#557596}
.loading-subtitle{margin:0;color:#8295a8;font-size:.8rem;line-height:1.9}
.progress-track{height:6px;margin:22px 4px 10px;background:#e4eef8;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#a6cdec,#d8b7d9,#f0c6d0);border-radius:99px}
.loading-screen.active .progress-bar{animation:loadProgress 2.1s ease-in-out forwards}
.loading-dots span{display:inline-block;animation:dot 1s ease-in-out infinite;color:#83a9ce}
.loading-dots span:nth-child(2){animation-delay:.15s}.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes loadingFloat{0%,100%{transform:translateY(0) rotate(-7deg) scale(1)}50%{transform:translateY(-9px) rotate(7deg) scale(1.06)}}
@keyframes loadProgress{0%{width:0}35%{width:45%}70%{width:76%}100%{width:100%}}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.18)}}
@keyframes cloud{from{translate:-8px 0}to{translate:18px -6px}}
@keyframes
